# Evaluates every host on each push and PR, and opens a weekly PR that bumps
# flake.lock. bc-llm's auto-upgrade builds whatever lock is on main, so the
# lock-update PR is the only way new packages reach it.
name: flake

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * 1"  # Mondays 15:00 UTC

jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b  # v31.11.3
      - name: Evaluate every host
        run: ./.github/eval-hosts.sh

  update-lock:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b  # v31.11.3
      - name: Update flake.lock
        run: nix flake update
      # A PR opened with GITHUB_TOKEN doesn't trigger the check job, so the
      # updated lock is evaluated here, before the PR exists.
      - name: Evaluate every host
        run: ./.github/eval-hosts.sh
      - name: Open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet flake.lock; then
            echo "flake.lock already current"
            exit 0
          fi
          branch="flake-lock-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Update flake.lock"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Update flake.lock ($(date -u +%Y-%m-%d))" \
            --body "Weekly lock update. Every host evaluated on the new lock in this workflow run. Merging deploys to bc-llm at its next 04:10 auto-upgrade."
