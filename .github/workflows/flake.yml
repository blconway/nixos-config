# Evaluates every host on each push and PR, and bumps flake.lock daily,
# committing it straight to main once every host evaluates. ai-fw's
# auto-upgrade builds whatever lock is on main at 04:10 Pacific, so this is
# how it follows nixos-unstable (docs/DECISIONS.md, D5).
name: flake

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"  # 10:00 UTC daily: 02:00 PST / 03:00 PDT, before ai-fw's 04:10 upgrade

jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b  # v31.11.3
      - name: Evaluate every host
        run: ./.github/eval-hosts.sh

  update-lock:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b  # v31.11.3
      - name: Update flake.lock
        run: nix flake update
      # The push below uses GITHUB_TOKEN, which doesn't trigger the check job,
      # so the new lock is evaluated here and nothing is pushed if it fails.
      - name: Evaluate every host
        run: ./.github/eval-hosts.sh
      - name: Commit to main
        run: |
          if git diff --quiet flake.lock; then
            echo "flake.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update flake.lock ($(date -u +%Y-%m-%d))"
          git push origin HEAD:main
