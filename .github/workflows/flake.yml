# Checks and builds every host on each push and PR, and bumps flake.lock
# daily, committing it straight to main once every host builds. ai-fw's
# auto-upgrade builds whatever lock is on main at 04:10 Pacific, so this is
# how it follows nixos-unstable (docs/DECISIONS.md, D5).
name: flake

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"  # 10:00 UTC daily: 02:00 PST / 03:00 PDT, before ai-fw's 04:10 upgrade

jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # One job per host so the PR check takes as long as the slowest host,
        # not the sum. `nix flake check` still evaluates every host, so a host
        # missing here is evaluated but not built.
        host: [ai-fw, bc-ws]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b  # v31.11.3
      - name: Evaluate every host and the invariants
        run: nix flake check --no-build
      - name: Formatting
        run: nix fmt -- --ci
      - name: Build ${{ matrix.host }}
        run: nix build --no-link .#checks.x86_64-linux.nixos-${{ matrix.host }}

  update-lock:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b  # v31.11.3
      # Built only to diff against, so the commit says what changed.
      - name: Build hosts on the current lock
        run: |
          for host in ai-fw bc-ws; do
            nix build --out-link "$RUNNER_TEMP/old-$host" ".#checks.x86_64-linux.nixos-$host"
          done
      - name: Update flake.lock
        run: nix flake update
      # The push below uses GITHUB_TOKEN, which doesn't trigger the check job,
      # so the new lock is checked here and nothing is pushed if it fails.
      # ai-fw deploys it unattended, so building matters, not just evaluating.
      - name: Check and build hosts on the new lock
        run: |
          nix flake check --no-build
          for host in ai-fw bc-ws; do
            nix build --out-link "$RUNNER_TEMP/new-$host" ".#checks.x86_64-linux.nixos-$host"
          done
      - name: Commit to main
        run: |
          if git diff --quiet flake.lock; then
            echo "flake.lock already current"
            exit 0
          fi
          msg="$RUNNER_TEMP/msg"
          echo "Update flake.lock ($(date -u +%Y-%m-%d))" > "$msg"
          for host in ai-fw bc-ws; do
            printf '\n%s:\n' "$host" >> "$msg"
            nix store diff-closures "$RUNNER_TEMP/old-$host" "$RUNNER_TEMP/new-$host" >> "$msg"
          done
          cat "$msg"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -a -F "$msg"
          git push origin HEAD:main
